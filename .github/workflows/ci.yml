name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: dist/ is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - run: npm test
      - run: npm run package

  action-smoke:
    # Runs the GitHub Action from this checkout against a mock LLM server and the closed demo PR (#1), without posting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node test/fixtures/mock-openai.js 8765 &
      - id: lcr
        uses: ./
        with:
          base-url: http://127.0.0.1:8765/v1
          pr-number: "1"
          repository: georgestephanis/diff-leppard
          review-event: none
      - name: Check outputs
        run: |
          echo "findings=${{ steps.lcr.outputs.findings }}"
          test "${{ steps.lcr.outputs.findings }}" = "1"
          grep -q "Mock finding" "${{ steps.lcr.outputs.report }}"
          jq -e '.runs[0].results | length == 1' "${{ steps.lcr.outputs.sarif }}"
