# Copy to .github/workflows/diff-leppard.yml in your repository.
#
# Reviews pull requests with YOUR model server (any OpenAI-compatible host: vLLM, Ollama, LM Studio,
# llama.cpp, SGLang, LocalAI, a hosted provider…) and posts the result as a PR review.
#
# Setup (repo or org → Settings → Secrets and variables → Actions):
#   LLM_BASE_URL   e.g. https://llm.example.com/v1 (must be reachable from the runner).
#                  Make it a SECRET if the address is private: secrets are masked in logs (public repos have
#                  public logs), variables are not. A variable works too; the secret wins if both exist.
#   LLM_MODEL      variable, e.g. Qwen/Qwen2.5-Coder-32B-Instruct (optional if the server has one model)
#   LLM_API_KEY    secret (optional)
#
#   gh secret set LLM_BASE_URL      # prompts for the value; add --org my-org --repos a,b to share across repos
#   gh secret set LLM_API_KEY
#   gh variable set LLM_MODEL --body "Qwen/Qwen2.5-Coder-32B-Instruct"
#
# Triggers:
#   - automatically when a PR is opened / reopened / marked ready for review
#   - on demand: a maintainer comments "/review" on a PR
#   - manually: Actions → Diff Leppard → Run workflow, with a PR number
name: Diff Leppard

on:
  pull_request:
    types: [opened, reopened, ready_for_review]   # add "synchronize" to re-review every push
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One review at a time per PR. Comments that aren't "/review" get their own group, so a stray
  # "thanks!" (or a bot comment) can't cancel a review that's in progress.
  group: >-
    diff-leppard-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{
    (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/review')) && github.event.comment.id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets aren't available to PRs from forks; /review comments are limited to people with write access
    # so strangers can't spend your GPU time.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest   # or a self-hosted runner on the same network as your model server
    timeout-minutes: 30
    steps:
      - name: Acknowledge /review
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

      # If the model server is on a private network, one option is joining your tailnet first:
      # - uses: tailscale/github-action@v3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      #     tags: tag:ci

      - uses: georgestephanis/diff-leppard@main
        with:
          base-url: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}
          api-key: ${{ secrets.LLM_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          review-event: comment          # comment | request-changes | none
          min-severity: minor
          # fail-on: critical            # make the check fail on critical findings
          # max-chunk-chars: 60000       # ~32k-token context
          # extra-body: '{"chat_template_kwargs": {"enable_thinking": false}}'   # Qwen3-style models on vLLM: much faster
          # extra-instructions: "This is a WordPress plugin: flag unescaped output and missing nonce checks."
