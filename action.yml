name: Diff Leppard Code Review
description: "AI code review for pull requests on your own LLM server: vLLM, Ollama, LM Studio, or any OpenAI-compatible API."
author: George Stephanis
branding:
  icon: check-square
  color: blue

inputs:
  base-url:
    description: "Model server base URL, e.g. https://llm.example.com/v1 (OpenAI-compatible) or http://host:11434 with provider: ollama. Must be reachable from the runner."
    required: true
  model:
    description: Model name. Empty = use the server's only model.
    default: ""
  api-key:
    description: API key, sent as "Authorization Bearer". Pass it from a secret.
    default: ""
  provider:
    description: openai | ollama. Empty = openai
    default: ""
  extra-headers:
    description: 'JSON object of extra HTTP headers, e.g. {"CF-Access-Client-Id": "…"}. Pass secrets via secrets.'
    default: ""
  extra-body:
    description: 'JSON object merged into every request body, e.g. {"chat_template_kwargs": {"enable_thinking": false}}'
    default: ""
  json-mode:
    description: json_object | json_schema | none
    default: ""
  review-event:
    description: "comment = post a comment review; request-changes = request changes when there are critical/major findings; none = don't post (job summary only)"
    default: comment
  min-severity:
    description: Drop findings below this severity (critical | major | minor | nit). Empty = the repo's .diff-leppard.json, else minor
    default: ""
  attribution:
    description: 'End the posted review with "Review generated by Diff Leppard, running <model>" (true/false). Empty = true'
    default: ""
  fail-on:
    description: Fail the job if any finding is at or above this severity. Empty = never fail on findings.
    default: ""
  max-chunk-chars:
    description: Characters per model request (the diff plus guidelines and surrounding code). Empty or 0 = auto (sized to the context window the server reports, e.g. vLLM's max_model_len)
    default: ""
  max-output-tokens:
    description: Max tokens the model may generate per request
    default: ""
  concurrency:
    description: Parallel model requests
    default: ""
  timeout-seconds:
    description: Per-request timeout
    default: ""
  verify-findings:
    description: "Second look at findings before reporting: off | critical-major | all. Empty = critical-major. off is faster"
    default: ""
  check-description:
    description: Check the PR description's claims against the change (true/false). Empty = the repo's .diff-leppard.json, else false
    default: ""
  no-context:
    description: "true = review the diff hunks only: no whole files, related code or AGENTS.md fallback. Faster, fewer findings"
    default: ""
  extra-instructions:
    description: Extra review guidelines added to the prompt. The repo's .github/code-review-instructions.md (on the base branch) is used automatically, or AGENTS.md, CLAUDE.md, .github/copilot-instructions.md or CONTRIBUTING.md if it has none.
    default: ""
  pr-number:
    description: Pull request number
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  repository:
    description: owner/repo
    default: ${{ github.repository }}
  github-token:
    description: Token used to read the PR and post the review (needs pull-requests write)
    default: ${{ github.token }}
  github-api-url:
    description: GitHub API URL (set automatically for GitHub Enterprise Server)
    default: ${{ github.api_url }}

outputs:
  findings:
    description: Number of findings
    value: ${{ steps.review.outputs.findings }}
  blocking:
    description: Number of critical + major findings
    value: ${{ steps.review.outputs.blocking }}
  report:
    description: Path to the Markdown report
    value: ${{ steps.review.outputs.report }}
  sarif:
    description: Path to the findings as SARIF (for github/codeql-action/upload-sarif → code scanning)
    value: ${{ steps.review.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
        # Never read or cache anything from the workspace: it may hold a PR's code (see the example's checkout step).
        package-manager-cache: false
    - name: Review pull request
      id: review
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/run.sh"'
      # Inputs reach the CLI as DIFF_LEPPARD_* variables only when set (run.sh), so empty inputs don't
      # override the repo's .diff-leppard.json or DIFF_LEPPARD_* variables in the step's env.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_API_URL: ${{ inputs.github-api-url }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_EXTRA_HEADERS: ${{ inputs.extra-headers }}
        INPUT_EXTRA_BODY: ${{ inputs.extra-body }}
        INPUT_JSON_MODE: ${{ inputs.json-mode }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_MAX_CHUNK_CHARS: ${{ inputs.max-chunk-chars }}
        INPUT_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        INPUT_ATTRIBUTION: ${{ inputs.attribution }}
        INPUT_VERIFY_FINDINGS: ${{ inputs.verify-findings }}
        INPUT_CHECK_DESCRIPTION: ${{ inputs.check-description }}
        INPUT_NO_CONTEXT: ${{ inputs.no-context }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REVIEW_EVENT: ${{ inputs.review-event }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
